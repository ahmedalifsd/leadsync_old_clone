{% extends 'layout/layout.html' %}

{% block title %}Edit Source - LeadSync{% endblock %}

{% block extra_css %}
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card border-0 rounded-3 bg-white">
            <div class="card-body">
                <h5 class="mb-4">
                    <i class="fas fa-edit me-2"></i>Edit Source
                </h5>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.name.id_for_label }}" class="form-label">Source Name</label>
                        {{ form.name }}
                        {% if form.name.errors %}
                            <div class="text-danger small">{{ form.name.errors }}</div>
                        {% endif %}
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{% url 'manage_sources' %}" class="btn btn-secondary">
                            <i class="fas fa-times me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
