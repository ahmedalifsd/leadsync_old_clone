{% extends 'layout/layout.html' %}
{% load static %}

{% block title %}Change Password - LeadSync{% endblock %}

{% block content %}
<style>
    .password-wrap {
        position: relative;
    }
    .password-toggle-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        border: 0;
        background: transparent;
        color: #6c757d;
        padding: 0;
        line-height: 1;
    }
    .password-toggle-btn:focus {
        outline: none;
        color: #0d6efd;
    }
</style>
<div class="container">
    <div class="main-content d-flex flex-column p-0">
        <div class="m-auto m-1230">

            <div class="row align-items-center">
                <div class="col-lg-6 d-none d-lg-block">
                    <img src="{% static 'assets/img/login.jpg' %}" class="rounded-3" style="height: 550px" alt="login">
                </div>
                <div class="col-lg-6 col-md-12 col-sm-12 col-12">
                    <div class="card shadow border-0">

            <div class="card-body p-5">
                <div class="mw-480 ms-lg-auto">
                                <div class="d-inline-block mb-4">
                                 <a href="{% url 'home' %}" aria-label="Go to home page">
                                    <img src="{% static 'assets/img/leadlogobg.png' %}" class="rounded-3 for-light-logo"
                                        alt="LeadSync">
                                    <img src="{% static 'assets/img/white-logo.svg' %}"
                                        class="rounded-3 for-dark-logo" alt="LeadSync">
                                 </a>
                                </div>
                                <h3 class="fs-28 mb-2">Change Password</h3>

                            </div>


                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_old_password" class="form-label">Current Password</label>
                        <div class="password-wrap">
                            <input type="password" class="form-control pe-5" id="id_old_password" name="old_password" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="id_old_password" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_new_password1" class="form-label">New Password</label>
                        <div class="password-wrap">
                            <input type="password" class="form-control pe-5" id="id_new_password1" name="new_password1" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="id_new_password1" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_new_password2" class="form-label">Confirm New Password</label>
                        <div class="password-wrap">
                            <input type="password" class="form-control pe-5" id="id_new_password2" name="new_password2" required>
                            <button type="button" class="password-toggle-btn toggle-password" data-target="id_new_password2" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="fas fa-save me-1"></i>Change Password
                    </button>

                    <div class="text-center">
                        <a href="{% url 'profile' %}" class="text-decoration-none">
                            <i class="fas fa-arrow-left me-1"></i>Back to Profile
                        </a>
                    </div>
                </form>

                {% if form.errors %}
                <div class="alert alert-danger mt-3">
                    <i class="fas fa-exclamation-circle me-1"></i>
                    Please correct the errors below.
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.toggle-password').forEach(function(btn) {
        btn.addEventListener('click', function() {
            const input = document.getElementById(this.getAttribute('data-target'));
            const icon = this.querySelector('i');
            if (!input) {
                return;
            }
            const show = input.type === 'password';
            input.type = show ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !show);
            icon.classList.toggle('fa-eye-slash', show);
            this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
    });
});
</script>
{% endblock %}
