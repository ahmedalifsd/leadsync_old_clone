<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <style>
        /* Reset */
        body, table, td, p, a, li, blockquote {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333333;
            line-height: 1.6;
        }
        .email-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .email-header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            padding: 35px 40px;
            text-align: center;
        }
        .email-header h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }
        .email-header .logo-text {
            color: rgba(255, 255, 255, 0.85);
            font-size: 13px;
            margin-top: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .email-body {
            padding: 40px;
        }
        .greeting {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 20px;
        }
        .message-text {
            font-size: 15px;
            color: #555555;
            margin-bottom: 15px;
            line-height: 1.7;
        }
        .highlight-box {
            background: linear-gradient(135deg, #f0f0ff 0%, #e8e6ff 100%);
            border-left: 4px solid #4f46e5;
            padding: 18px 22px;
            border-radius: 0 8px 8px 0;
            margin: 25px 0;
        }
        .highlight-box p {
            font-size: 15px;
            color: #4f46e5;
            font-weight: 500;
            margin: 0;
        }
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            margin: 25px 0;
            text-align: center;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
        }
        .info-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .info-label {
            font-size: 13px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            width: 120px;
            min-width: 120px;
        }
        .info-value {
            font-size: 15px;
            color: #333;
            font-weight: 500;
        }
        .email-footer {
            background-color: #f8f9fc;
            padding: 25px 40px;
            text-align: center;
            border-top: 1px solid #eef0f5;
        }
        .email-footer p {
            font-size: 12px;
            color: #999;
            margin: 3px 0;
        }
        .divider {
            height: 1px;
            background-color: #eef0f5;
            margin: 25px 0;
        }
        /* Responsive */
        @media only screen and (max-width: 620px) {
            .email-wrapper {
                margin: 10px;
                border-radius: 8px;
            }
            .email-header, .email-body, .email-footer {
                padding: 25px 20px;
            }
            .email-header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body style="background-color: #f0f2f5; padding: 30px 10px;">
    <div class="email-wrapper">
        <!-- Header -->
        <div class="email-header">
            <h1>LeadSync</h1>
            <div class="logo-text">Lead Management Platform</div>
        </div>

        <!-- Body -->
        <div class="email-body">
            {% block content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div class="email-footer">
            <p>This is an automated email from LeadSync.</p>
            <p>Please do not reply to this email.</p>
            <p style="margin-top: 10px; color: #bbb;">&copy; {{ year }} LeadSync. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
